<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3c7"/></marker></defs><rect width="1200" height="600" fill="#12162a"/><text x="40" y="54" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#eef0ff" text-anchor="start">How an SPL token is held</text><text x="40" y="88" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#9aa3c7" text-anchor="start">Wallets don&#x27;t hold tokens. Token accounts do.</text><rect x="40" y="140" width="250" height="120" rx="14" fill="#1c2240" stroke="#8b9cff" stroke-width="2"/><text x="60" y="176" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#8b9cff" text-anchor="start">Me</text><text x="60" y="208" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9aa3c7" text-anchor="start">the authority wallet</text><text x="60" y="236" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9aa3c7" text-anchor="start">signs mint + transfer</text><rect x="40" y="380" width="250" height="120" rx="14" fill="#1c2240" stroke="#2fe0a5" stroke-width="2"/><text x="60" y="416" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2fe0a5" text-anchor="start">Friend</text><text x="60" y="448" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9aa3c7" text-anchor="start">a second wallet</text><text x="60" y="476" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9aa3c7" text-anchor="start">never signed anything</text><rect x="420" y="140" width="330" height="130" rx="14" fill="#1c2240" stroke="#2e3760" stroke-width="2"/><text x="440" y="176" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef0ff" text-anchor="start">My token account</text><text x="440" y="208" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9aa3c7" text-anchor="start">balance: 999,000</text><text x="440" y="236" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9aa3c7" text-anchor="start">owner: Me</text><rect x="420" y="380" width="330" height="130" rx="14" fill="#1c2240" stroke="#2e3760" stroke-width="2"/><text x="440" y="416" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef0ff" text-anchor="start">Friend&#x27;s token account</text><text x="440" y="448" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9aa3c7" text-anchor="start">balance: 1,000</text><text x="440" y="476" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9aa3c7" text-anchor="start">created + paid for by me</text><rect x="880" y="200" width="280" height="240" rx="14" fill="#1c2240" stroke="#f2c14e" stroke-width="2"/><text x="900" y="236" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f2c14e" text-anchor="start">Mint account</text><text x="900" y="268" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9aa3c7" text-anchor="start">supply: 1,000,000</text><text x="900" y="296" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9aa3c7" text-anchor="start">decimals: 6</text><text x="900" y="324" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9aa3c7" text-anchor="start">mint authority: Me</text><text x="900" y="352" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9aa3c7" text-anchor="start">freeze authority: none</text><line x1="290" y1="200" x2="418" y2="200" stroke="#9aa3c7" stroke-width="2.5" marker-end="url(#head)"/><text x="354.0" y="190.0" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#9aa3c7" text-anchor="middle">owns</text><line x1="290" y1="440" x2="418" y2="440" stroke="#9aa3c7" stroke-width="2.5" marker-end="url(#head)"/><text x="354.0" y="430.0" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#9aa3c7" text-anchor="middle">owns</text><line x1="750" y1="205" x2="878" y2="280" stroke="#9aa3c7" stroke-width="2.5" marker-end="url(#head)"/><text x="815" y="225" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#9aa3c7" text-anchor="middle">of mint</text><line x1="750" y1="445" x2="878" y2="360" stroke="#9aa3c7" stroke-width="2.5" marker-end="url(#head)"/><text x="815" y="430" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#9aa3c7" text-anchor="middle">of mint</text><line x1="585" y1="272" x2="585" y2="376" stroke="#2fe0a5" stroke-width="2.5" marker-end="url(#head)"/><text x="660" y="330" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#2fe0a5" text-anchor="middle">transfer 1,000</text><text x="40" y="570" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9aa3c7" text-anchor="start">Token account address = PDA(wallet, mint), so anyone can find it from those two.</text></svg>